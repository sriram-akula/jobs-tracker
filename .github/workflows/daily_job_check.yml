name: Daily Job Posting Check

on:
  schedule:
    # 18:30 UTC = 00:00 IST (India). GitHub's cron scheduler can run a few
    # minutes late during high load - that's normal, not a bug.
    - cron: "30 18 * * *"
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated report back

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push updated report
        run: |
          git config user.name "job-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest_results.json docs/index.html
          git diff --quiet --cached || git commit -m "Daily job check: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
